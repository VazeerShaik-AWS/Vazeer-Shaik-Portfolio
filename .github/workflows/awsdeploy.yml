name: Deploy Portfolio to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::404290031955:role/GitHubPortfolioDeployRole
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy to S3
        run: aws s3 sync . s3://vazeer-portfolio --delete --exclude ".git/*" --exclude ".github/*" --exclude "README.md"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id EIOG7W8IY0H7H --paths "/*"